<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profils - Look in My Book</title>
    <link rel="stylesheet" href="src/main.css">
    <link rel="stylesheet" href="src/profile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Momo+Trust+Sans:wght@200..800&display=swap" rel="stylesheet">
</head>
<body class="profile-page">
    <div id="navigation"></div>
    <main class="profile-window" aria-labelledby="profile-title">
        <h1 id="profile-title" class="profile-title">Tavs profils</h1>

        <section class="profile-content">
            <div class="profile-left">
                <div class="profile-picture" role="img" aria-label="Profila bilde">
                    <img id="profile-image" src="" alt="Profila bilde">
                    <span id="profile-initial">U</span>
                </div>

                <h2 class="badge-title">Sasniegumi</h2>
                <ul id="badges" class="badges" aria-label="Sasniegumu žetoni"></ul>
            </div>

            <div class="profile-info">
                <div class="info-group">
                    <span class="info-label">Vārds:</span>
                    <span id="first-name" class="info-value">-</span>
                </div>

                <div class="info-group">
                    <span class="info-label">Uzvārds:</span>
                    <span id="last-name" class="info-value">-</span>
                </div>

                <div class="info-group">
                    <span class="info-label">E-pasts:</span>
                    <span id="email" class="info-value">-</span>
                </div>

                <button id="logout-button" class="logout-button" type="button">Izrakstīties no profila</button>
            </div>
        </section>
    </main>

    <script src="src/js/navigation.js"></script>
    <script src="src/js/main.js"></script>
    <script>
        function renderProfile(user) {
            const firstName = user?.vards || '';
            const lastName = user?.uzvards || '';
            const email = user?.epasts || '';
            const profileImage = user?.profile_image || user?.profileImage || user?.avatar || '';

            document.getElementById('first-name').textContent = firstName || '-';
            document.getElementById('last-name').textContent = lastName || '-';
            document.getElementById('email').textContent = email || '-';
            document.getElementById('profile-initial').textContent = Array.from(firstName || email)[0]?.toUpperCase() || 'U';

            if (profileImage) {
                const image = document.getElementById('profile-image');
                image.src = profileImage;
                image.style.display = 'block';
                document.getElementById('profile-initial').style.display = 'none';
            }
        }

        function renderBadges(achievements = []) {
            const badges = document.getElementById('badges');
            badges.innerHTML = '';

            if (!achievements.length) {
                const emptyMessage = document.createElement('li');
                emptyMessage.className = 'badges-empty';
                emptyMessage.textContent = 'Vēl nav iegūtu sasniegumu.';
                badges.appendChild(emptyMessage);
                return;
            }

            achievements.forEach((achievement) => {
                const badge = document.createElement('li');
                const name = document.createElement('h3');
                const description = document.createElement('p');

                badge.className = 'badge';
                name.className = 'badge-name';
                description.className = 'badge-description';

                name.textContent = achievement.nosaukums || 'Sasniegums';
                description.textContent = achievement.apraksts || 'Apraksts nav pievienots.';

                badge.append(name, description);
                badges.appendChild(badge);
            });
        }

        async function loadProfile() {
            try {
                const response = await fetch('/api/users/me', {
                    method: 'GET',
                    credentials: 'include'
                });
                const data = await response.json();

                if (!response.ok || !data.success) {
                    window.location.href = 'login.html';
                    return;
                }

                localStorage.setItem('user', JSON.stringify(data.user));
                updateLoginIndicator();
                renderProfile(data.user);
                renderBadges(data.achievements || []);
            } catch (error) {
                console.error('Neizdevās ielādēt profila datus:', error);
                window.location.href = 'login.html';
            }
        }

        loadProfile();

        document.getElementById('logout-button').addEventListener('click', () => {
            localStorage.removeItem('user');

            fetch('/api/users/logout', { method: 'POST', credentials: 'include' })
                .catch((error) => console.error('Neizdevās izrakstīties no servera:', error))
                .finally(() => {
                    window.location.href = 'hero.html';
                });
        });
    </script>
</body>
</html>
