<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavs profils</title>
    <link rel="stylesheet" href="src/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Momo+Trust+Sans:wght@200..800&display=swap" rel="stylesheet">
    <style>
        #profils {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #111111;
            font-family: 'Momo Trust Sans', Arial, sans-serif;
        }

        .profile-window {
            width: min(740px, calc(100% - 32px));
            min-height: 460px;
            border: 1px solid #777777;
            padding: 14px 34px 30px;
            box-sizing: border-box;
        }

        .profile-title {
            margin: 0 0 34px;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
        }

        .profile-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 34px 74px;
        }

        .profile-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .profile-picture {
            width: 136px;
            height: 136px;
            margin: 0 auto 44px;
            border-radius: 50%;
            background: #d7d7d7;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #000000;
            font-size: 82px;
            line-height: 1;
            font-weight: 400;
        }

        .profile-picture img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .badge-title {
            margin: 0 0 12px;
            font-size: 24px;
            font-weight: 500;
        }

        .badges {
            display: grid;
            grid-template-columns: repeat(4, 54px);
            gap: 20px 22px;
        }

        .badge {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #d7d7d7;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge.earned {
            background: #FF9D00;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            min-height: 336px;
        }

        .info-group {
            margin-bottom: 24px;
            font-size: 24px;
        }

        .info-label {
            display: block;
            font-weight: 500;
        }

        .info-value {
            display: block;
            overflow-wrap: anywhere;
        }

        .logout-button {
            width: 252px;
            margin-top: auto;
            padding: 6px 16px;
            border: 1px solid #777777;
            background: #ffffff;
            color: #111111;
            font: inherit;
            font-size: 16px;
            cursor: pointer;
        }

        .logout-button:hover,
        .logout-button:focus {
            background: #f1f1f1;
        }

        @media (max-width: 640px) {
            #profils {
                align-items: flex-start;
                padding: 18px 0;
                box-sizing: border-box;
            }

            .profile-window {
                padding: 14px 22px 26px;
            }

            .profile-content {
                grid-template-columns: 1fr;
                gap: 28px;
            }

            .profile-picture {
                margin-bottom: 30px;
            }

            .badges {
                grid-template-columns: repeat(3, 54px);
            }

            .profile-info {
                min-height: 0;
            }

            .logout-button {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body id="profils">
    <main class="profile-window" aria-labelledby="profile-title">
        <h1 id="profile-title" class="profile-title">Tavs profils</h1>

        <section class="profile-content">
            <div class="profile-left">
                <div class="profile-picture" role="img" aria-label="Profila bilde">
                    <img id="profile-image" src="" alt="Profila bilde">
                    <span id="profile-initial">U</span>
                </div>

                <h2 class="badge-title">Sasniegumu žetoni:</h2>
                <div id="badges" class="badges" aria-label="Sasniegumu žetoni">
                    <span class="badge"></span>
                    <span class="badge"></span>
                    <span class="badge"></span>
                    <span class="badge"></span>
                    <span class="badge"></span>
                    <span class="badge"></span>
                </div>
            </div>

            <div class="profile-info">
                <div class="info-group">
                    <span class="info-label">Vārds:</span>
                    <span id="first-name" class="info-value">Uldis</span>
                </div>

                <div class="info-group">
                    <span class="info-label">Uzvārds:</span>
                    <span id="last-name" class="info-value">Uldis</span>
                </div>

                <div class="info-group">
                    <span class="info-label">E-pasts:</span>
                    <span id="email" class="info-value">example@mail.com</span>
                </div>

                <button id="logout-button" class="logout-button" type="button">Izrakstīties no profila</button>
            </div>
        </section>
    </main>

    <script>
        function renderProfile(user) {
            const firstName = user?.vards || '';
            const lastName = user?.uzvards || '';
            const email = user?.epasts || '';
            const profileImage = user?.profile_image || user?.profileImage || user?.avatar || '';

            document.getElementById('first-name').textContent = firstName || '-';
            document.getElementById('last-name').textContent = lastName || '-';
            document.getElementById('email').textContent = email || '-';
            document.getElementById('profile-initial').textContent = Array.from(firstName || email)[0]?.toUpperCase() || 'U';

            if (profileImage) {
                const image = document.getElementById('profile-image');
                image.src = profileImage;
                image.style.display = 'block';
                document.getElementById('profile-initial').style.display = 'none';
            }
        }

        function renderBadges(achievements = []) {
            const badges = document.getElementById('badges');
            const visibleSlots = Math.max(6, achievements.length);

            badges.innerHTML = '';

            for (let i = 0; i < visibleSlots; i++) {
                const achievement = achievements[i];
                const badge = document.createElement('span');
                badge.className = achievement ? 'badge earned' : 'badge';

                if (achievement) {
                    badge.title = achievement.apraksts
                        ? `${achievement.nosaukums}: ${achievement.apraksts}`
                        : achievement.nosaukums;
                    badge.textContent = Array.from(achievement.nosaukums || '?')[0]?.toUpperCase() || '?';
                    badge.setAttribute('aria-label', achievement.nosaukums);
                }

                badges.appendChild(badge);
            }
        }

        async function loadProfile() {
            try {
                const response = await fetch('/api/users/me', {
                    method: 'GET',
                    credentials: 'include'
                });
                const data = await response.json();

                if (!response.ok || !data.success) {
                    window.location.href = 'login.html';
                    return;
                }

                localStorage.setItem('user', JSON.stringify(data.user));
                renderProfile(data.user);
                renderBadges(data.achievements || []);
            } catch (error) {
                console.error('Neizdevās ielādēt profila datus:', error);
                window.location.href = 'login.html';
            }
        }

        loadProfile();

        document.getElementById('logout-button').addEventListener('click', () => {
            localStorage.removeItem('user');

            fetch('/api/users/logout', { method: 'POST', credentials: 'include' })
                .catch((error) => console.error('Neizdevās izrakstīties no servera:', error))
                .finally(() => {
                    window.location.href = 'index.html';
                });
        });
    </script>
</body>
</html>
