<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="src/main.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Momo+Trust+Sans:wght@200..800&display=swap" rel="stylesheet">
    </head>
    <body>
        <nav id="nav_bar">
            <ul id="nav_list_left">
                <li><a href="hero.html" id="logo"><h1>LIMB</h1></a></li>
            </ul>

            <ul id="nav_list_right">
                <li><a href="registration.html" id="register_button">Reģistrēties</a></li>
                <li><a href="login.html" id="login_button">Pieslēgties</a></li>
            </ul>
        </nav>

        <form action="registration" id="registration_form">
            <h1>Reģistrēties</h1>

            <div>
                <div>
                    <label for="name">Vārds</label>
                    <input type="text" id="first_name" name="first_name" required/>
                </div>

                <div>
                    <label for="last_name">Uzvārds</label>
                    <input type="text" id="last_name" name="last_name" required/>
                </div>

                <div>
                    <label for="email">E-pasts</label>
                    <input type="text" id="email" name="email" required/>
                </div>

                <div>
                    <label for="password">Parole</label>
                    <input type="password" id="password" name="password" required/>
                </div>

                <div>
                    <label for="rep_password">Atkārtota parole</label>
                    <input type="password" id="rep_password" name="rep_password" required/>
                </div>

                <div>
                    <input type="checkbox" id="checkbox" name="checkbox" required/>
                    <label for="checkbox">Noklikšķinot šo es piekrītu mājaslapas lietošanas noteikumiem.</label>
                </div>

                <button type="button" id="cancel">Atcelt</button>

                <button type="submit" id="submit">Reģistrēties</button>
            </div>
        </form>
        

        <script src="" async defer>

            document.getElementById("registration_form").addEventListener("submit", async (event) => {
                event.preventDefault();

                const first_name = document.getElementById("first_name").value;

                const last_name = document.getElementById("last_name").value;

                const email = document.getElementById("email").value;

                const password = document.getElementById("password").value;

                const rep_password = document.getElementById("rep_password").value;

                const response = await fetch("http://localhost:1000/api/users", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        first_name: first_name,
                        last_name: last_name,
                        email: email,
                        password: password,
                        rep_password: rep_password
                    })
                });

    const data = await response.json();

    console.log(data);
            })

        </script>
    </body>
</html>
