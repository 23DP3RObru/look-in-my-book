<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Management</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fa;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: #2c3e50;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }

    header h1 { font-size: 1.3rem; font-weight: 600; }
    .api-status { font-size: .85rem; color: #95a5a6; }
    .status-ok   { color: #27ae60; font-weight: bold; }
    .status-err  { color: #e74c3c; font-weight: bold; }

    .toolbar {
      background: #fff;
      padding: 12px 24px;
      display: flex;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    .toolbar button,
    .toolbar select,
    .toolbar input[type="text"] {
      padding: 6px 12px;
      font-size: .85rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }

    .toolbar button:hover { background: #f0f0f0; }

    .btn-add { background: #27ae60; color: #fff; border: none; font-weight: 500; }
    .btn-add:hover { background: #2ecc71; }

    .btn-danger { background: #e74c3c; color: #fff; border: none; font-weight: 500; }
    .btn-danger:hover { background: #c0392b; }

    .btn-edit { background: #3498db; color: #fff; border: none; font-weight: 500; }
    .btn-edit:hover { background: #2980b9; }

    .search-input { padding: 6px 12px; font-size: .85rem; width: 220px; }

    .table-wrapper {
      overflow-x: auto;
      padding: 16px 24px;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }

    table { width: 100%; border-collapse: collapse; font-size: .9rem; }

    thead th {
      text-align: left;
      padding: 10px 12px;
      background: #34495e;
      color: #fff;
      font-weight: 600;
      position: sticky; top: 0;
    }

    tbody td { padding: 9px 12px; border-bottom: 1px solid #eee; }
    tbody tr:hover td { background: #f8f9fa; }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.5);
      display: none; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: #fff; padding: 24px;
      border-radius: 6px; width: 90%; max-width: 520px;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
    }

    .modal h2 { margin-bottom: 16px; color: #2c3e50; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: .85rem; color: #555; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 6px 10px;
      border: 1px solid #ccc; border-radius: 4px; font-size: .9rem;
    }

    .modal-actions {
      display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;
    }

    .btn-cancel { background: #95a5a6; color: #fff; border: none; padding: 6px 14px; cursor: pointer; }
    .btn-cancel:hover { opacity: .8; }

    .flash {
      position: fixed; top: 72px; left: 50%;
      transform: translateX(-50%);
      padding: 10px 24px; border-radius: 4px;
      color: #fff; font-weight: 600; font-size: .85rem; z-index: 200;
      opacity: 0; transition: opacity .3s; pointer-events: none;
    }
    .flash.show { opacity: 1; }
    .flash-success { background: #27ae60; }
    .flash-error   { background: #e74c3c; }

    .empty-state { text-align: center; padding: 48px 20px; color: #95a5a6; font-size: 1rem; }
  </style>
</head>

<body>

<nav style="background: #2c3e50; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;">
  <h1 style="font-size: 1.2rem;">Logo</h1>
  <ul style="list-style: none; display: flex; gap: 20px; margin: 0;">
    <li><a href="registration.html" id="register_button" style="color: #fff; text-decoration: none;">Reģistrēties</a></li>
    <li><a href="login.html" id="login_button" style="color: #fff; text-decoration: none;">Pieslēgties</a></li>
    <li id="login_indicator" style="display: none; color: #fff;">
      <span id="user_greeting">Sveiki, <strong id="user_name"></strong>!</span>
      <a href="#" id="logout_link" style="color: #fff; text-decoration: none; margin-left: 15px;">Izrakstīties</a>
    </li>
  </ul>
</nav>

<header>
  <h1>Book Management System</h1>
  <span class="api-status" id="apiStatus">● Connecting …</span>
</header>

<div class="toolbar">
  <input type="text" class="search-input" id="searchInput" placeholder="Search title / author …" autocomplete="off">
  <select id="filterSelect">
    <option value="">All Genres</option>
    <option value="Classic">Classic</option>
    <option value="Dystopian">Dystopian</option>
    <option value="Fantasy">Fantasy</option>
  </select>
  <button class="btn-add" onclick="openModal('add')">➕ Add Book</button>
</div>

<div class="table-wrapper">
  <table id="dataTable">
    <thead>
      <tr id="tableHead"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add Book</h2>
    <form id="bookForm" onsubmit="handleSubmit(event)">
      <!-- Rendered dynamically -->
    </form>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-add" id="modalSubmitBtn" type="button" onclick="document.getElementById('bookForm').requestSubmit()">Save</button>
    </div>
  </div>
</div>

<div class="flash" id="flash"></div>

<script>
// Relative path prevents port mismatches
const API_BASE = '/api/books';

let currentFilter = '';
let searchQuery   = '';
let editingId     = null;
let currentBooks  = [];

const COLUMNS = ['gramata_id', 'nosaukums', 'autors', 'lapas_kopa', 'zanrs', 'atsauksmes_atskaites'];

document.addEventListener('DOMContentLoaded', () => {
  initTableHeaders();
  loadBooks();
  setupEventListeners();
});

function initTableHeaders() {
  const thead = document.getElementById('tableHead');
  thead.innerHTML = '';
  COLUMNS.forEach((col, i) => {
    const th = document.createElement('th');
    th.textContent = col.replace(/_/g, ' ').toUpperCase();
    if (col === 'gramata_id') {
      th.style.cursor = 'pointer';
      th.onclick = () => sortTable(i);
    }
    thead.appendChild(th);
  });
  const thAction = document.createElement('th');
  thAction.textContent = 'ACTIONS';
  thead.appendChild(thAction);
}

async function apiGet(params = {}) {
  const url = new URL(API_BASE, window.location.origin);
  Object.entries(params).forEach(([k, v]) => { if (v) url.searchParams.set(k, v); });
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error(`HTTP ${res.status}:${res.statusText}`);
  return res.json();
}

async function apiPost(data) {
  const res = await fetch(API_BASE, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}:${res.statusText}`);
  return res.json();
}

async function apiPut(id, data) {
  const res = await fetch(`${API_BASE}/${id}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}:${res.statusText}`);
  return res.json();
}

async function apiDelete(id) {
  const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
  if (!res.ok) throw new Error(`HTTP ${res.status}:${res.statusText}`);
  return res.json();
}

async function loadBooks() {
  const statusEl = document.getElementById('apiStatus');
  statusEl.innerHTML = '● Fetching …';
  statusEl.className = 'api-status';

  try {
    currentBooks = await apiGet({ genre: currentFilter, search: searchQuery });

    if (currentBooks.length === 0) {
      showEmptyState();
    } else {
      renderTable(currentBooks);
    }

    updateApiStatus('OK');
  } catch (err) {
    showToast(err.message, 'error');
    updateApiStatus('ERR', err.message);
  }
}

function showEmptyState() {
  const body = document.getElementById('tableBody');
  body.innerHTML = `<tr><td colspan="${COLUMNS.length + 1}" class="empty-state">No records found.</td></tr>`;
}

function renderTable(rows) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  rows.forEach(row => {
    const tr = document.createElement('tr');
    COLUMNS.forEach(col => {
      const td = document.createElement('td');
      td.textContent = row[col] ?? '';
      tr.appendChild(td);
    });

    const actionTd = document.createElement('td');
    actionTd.appendChild(buildEditBtn(row.gramata_id));
    actionTd.appendChild(buildDeleteBtn(row.gramata_id));
    tr.appendChild(actionTd);

    tbody.appendChild(tr);
  });
}

function setupEventListeners() {
  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    loadBooks();
  });

  document.getElementById('filterSelect').addEventListener('change', (e) => {
    currentFilter = e.target.value;
    loadBooks();
  });
}

function openModal(mode, id = null) {
  const overlay = document.getElementById('modalOverlay');
  const title   = document.getElementById('modalTitle');

  if (mode === 'edit') {
    editingId = id;
    title.textContent = '✎ Edit Book';
    renderFormFields(id);
    document.getElementById('modalSubmitBtn').textContent = 'Update';
  } else {
    editingId = null;
    title.textContent = '➕ Add New Book';
    renderFormFields(null);
    document.getElementById('modalSubmitBtn').textContent = 'Add Book';
  }

  overlay.classList.add('active');
}

function closeModal() {
  editingId = null;
  document.getElementById('modalOverlay').classList.remove('active');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

function renderFormFields(id) {
  const form = document.getElementById('bookForm');
  const book = currentBooks.find(b => b.gramata_id === id) || {};

  form.innerHTML = `
    <div class="form-group">
      <label for="f-nosaukums">Title (Nosaukums) *</label>
      <input type="text" id="f-nosaukums" name="nosaukums" value="${escapeHtml(book.nosaukums || '')}" required>
    </div>
    <div class="form-group">
      <label for="f-autors">Author (Autors) *</label>
      <input type="text" id="f-autors" name="autors" value="${escapeHtml(book.autors || '')}" required>
    </div>
    <div class="form-group">
      <label for="f-lapas_kopa">Total Pages (Lapas Kopā)</label>
      <input type="number" id="f-lapas_kopa" name="lapas_kopa" value="${book.lapas_kopa ?? ''}" min="0">
    </div>
    <div class="form-group">
      <label for="f-zanrs">Genre (Žanrs)</label>
      <input type="text" id="f-zanrs" name="zanrs" value="${escapeHtml(book.zanrs || '')}">
    </div>
    <div class="form-group">
      <label for="f-atsauksmes">Rating (Atsauksmes)</label>
      <input type="number" step="0.1" id="f-atsauksmes" name="atsauksmes_atskaites" value="${book.atsauksmes_atskaites ?? ''}" min="0" max="5">
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function handleSubmit(e) {
  e.preventDefault();

  const form      = document.getElementById('bookForm');
  const submitBtn = document.getElementById('modalSubmitBtn');
  const isEdit    = editingId !== null;

  const nosaukums            = form.querySelector('#f-nosaukums').value.trim();
  const autors               = form.querySelector('#f-autors').value.trim();
  const lapas_kopa           = parseInt(form.querySelector('#f-lapas_kopa').value, 10) || 0;
  const zanrs                = form.querySelector('#f-zanrs').value.trim();
  const atsauksmes_atskaites = parseFloat(form.querySelector('#f-atsauksmes').value) || 0;

  if (!nosaukums || !autors) {
    showToast('Title and Author are required.', 'error');
    return;
  }

  submitBtn.disabled = true;

  try {
    const payload = { nosaukums, autors, lapas_kopa, zanrs, atsauksmes_atskaites };
    if (isEdit) {
      await apiPut(editingId, payload);
      showToast('Book updated successfully.', 'success');
    } else {
      await apiPost(payload);
      showToast('Book added successfully.', 'success');
    }

    closeModal();
    loadBooks();
  } catch (err) {
    showToast(err.message, 'error');
  } finally {
    submitBtn.disabled = false;
  }
}

function buildDeleteBtn(id) {
  const btn = document.createElement('button');
  btn.className = 'btn-danger';
  btn.textContent = '🗑️ Delete';
  btn.style.cssText = 'padding: 4px 8px; margin-right: 6px; font-size: .75rem; cursor: pointer; border-radius: 3px;';
  btn.addEventListener('click', async () => {
    if (!confirm(`Delete book #${id}? This cannot be undone.`)) return;
    try {
      await apiDelete(id);
      showToast('Book deleted.', 'success');
      loadBooks();
    } catch (err) {
      showToast(err.message, 'error');
    }
  });
  return btn;
}

function buildEditBtn(id) {
  const btn = document.createElement('button');
  btn.className = 'btn-edit';
  btn.textContent = '✎ Edit';
  btn.style.cssText = 'padding: 4px 8px; margin-right: 6px; font-size: .75rem; cursor: pointer; border-radius: 3px;';
  btn.addEventListener('click', () => openModal('edit', id));
  return btn;
}

function showToast(message, type = 'success') {
  const flash = document.getElementById('flash');
  flash.textContent = message;
  flash.className = `flash flash-${type} show`;
  setTimeout(() => { flash.classList.remove('show'); }, 1000);
}

function updateApiStatus(state, detail = '') {
  const el = document.getElementById('apiStatus');
  if (state === 'OK')    { el.innerHTML = '● Ready';          el.className = 'api-status status-ok'; }
  else if (state === 'ERR'){ el.innerHTML = `✕ ${detail}`; el.className = 'api-status status-err'; }
  else                  { el.innerHTML = '○ Connecting …';    el.className = 'api-status'; }
}
</script>

<script src="src/js/main.js"></script>

</body>
</html>
