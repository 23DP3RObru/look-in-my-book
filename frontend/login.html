<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="src/main.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Momo+Trust+Sans:wght@200..800&display=swap" rel="stylesheet">
    </head>

    <body>
        <nav id="nav_bar">
            <h1 id="logo">Logo</h1>

            <ul id="nav_list">
                <li><a href="registration.html" id="register_button">Reģistrēties</a></li>
                <li><a href="login.html" id="login_button">Pieslēgties</a></li>
            </ul>
        </nav>

        <form action="login" id="login_form">
            <h1>Pieslēgties</h1>

            <div>
                <div>
                    <label for="email">E-pasts</label>
                    <input type="text" id="email" name="email" required/>
                </div>

                <div>
                    <label for="password">Parole</label>
                    <input type="password" id="password" name="password" required/>
                </div>

                <button type="button" id="cancel">Atcelt</button>

                <button type="submit" id="submit">Pieslēgties</button>
            </div>
        </form>
        

        <script src="" async defer>

            document.getElementById("login_form").addEventListener("submit", async (event) => {
                event.preventDefault();

                const email = document.getElementById("email").value;

                const password = document.getElementById("password").value;

                const response = await fetch("http://localhost:1000/api/users", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

    const data = await response.json();

    console.log(data);
            })

        </script>
    </body>
</html>
