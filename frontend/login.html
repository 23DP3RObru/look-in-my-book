<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        <nav>
            <h1>Logo</h1>

            <ul>
                <li><a href="registration.html">Reģistrēties</a></li>
                <li><a href="login.html">Pieslēgties</a></li>
            </ul>
        </nav>

        <form action="login" id="login_form">
            <h1>Pieslēgties</h1>

            <div>
                <div>
                    <label for="email">E-pasts</label>
                    <input type="text" id="email" name="email" required/>
                </div>

                <div>
                    <label for="password">Parole</label>
                    <input type="password" id="password" name="password" required/>
                </div>

                <button type="button" id="cancel">Atcelt</button>

                <button type="submit" id="submit">Pieslēgties</button>
            </div>
        </form>
        

        <script src="" async defer>

            document.getElementById("login_form").addEventListener("submit", async (event) => {
                event.preventDefault();

                const email = document.getElementById("email").value;

                const password = document.getElementById("password").value;

                const response = await fetch("http://localhost:1000/api/users", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

    const data = await response.json();

    console.log(data);
            })

        </script>
    </body>
</html>
